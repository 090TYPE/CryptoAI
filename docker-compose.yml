name: cryptoai

# Whole server contour: TimescaleDB + public API (edge) + candle/collector worker
# + withdrawal executor (core). Only the API publishes a port. Migrations in ./db
# are applied automatically on first DB boot (init runs first via 001_ prefix).
#
#   docker compose up -d --build
#   curl http://localhost:8080/health
#
# Dev defaults are inline; override via a .env file for anything real.

services:
  db:
    image: timescale/timescaledb:latest-pg16
    environment:
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: cryptoai
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/001_init.sql:ro
      - ./db/002_dex_data.sql:/docker-entrypoint-initdb.d/002_dex_data.sql:ro
      - ./db/003_more_data.sql:/docker-entrypoint-initdb.d/003_more_data.sql:ro
      - ./db/004_custodial.sql:/docker-entrypoint-initdb.d/004_custodial.sql:ro
      - ./db/005_alerts.sql:/docker-entrypoint-initdb.d/005_alerts.sql:ro
      - ./db/006_bots.sql:/docker-entrypoint-initdb.d/006_bots.sql:ro
      - ./db/007_notifications.sql:/docker-entrypoint-initdb.d/007_notifications.sql:ro
      - ./db/008_2fa.sql:/docker-entrypoint-initdb.d/008_2fa.sql:ro
      - ./db/009_ai_scores.sql:/docker-entrypoint-initdb.d/009_ai_scores.sql:ro
      - ./db/010_ai_anomalies.sql:/docker-entrypoint-initdb.d/010_ai_anomalies.sql:ro
      - ./db/011_inbox.sql:/docker-entrypoint-initdb.d/011_inbox.sql:ro
      - ./db/012_ai_digests.sql:/docker-entrypoint-initdb.d/012_ai_digests.sql:ro
      - ./db/013_grid_orders.sql:/docker-entrypoint-initdb.d/013_grid_orders.sql:ro
      - ./db/014_tsl_positions.sql:/docker-entrypoint-initdb.d/014_tsl_positions.sql:ro
      - ./db/015_user_flags.sql:/docker-entrypoint-initdb.d/015_user_flags.sql:ro
      - ./db/016_bot_orders_idempotency.sql:/docker-entrypoint-initdb.d/016_bot_orders_idempotency.sql:ro
      - ./db/017_tsl_native_sl.sql:/docker-entrypoint-initdb.d/017_tsl_native_sl.sql:ro
      - ./db/018_trade_orders.sql:/docker-entrypoint-initdb.d/018_trade_orders.sql:ro
      - ./db/019_demand_polling.sql:/docker-entrypoint-initdb.d/019_demand_polling.sql:ro
      - ./db/020_aggregate_policies.sql:/docker-entrypoint-initdb.d/020_aggregate_policies.sql:ro
      - ./db/021_server_settings.sql:/docker-entrypoint-initdb.d/021_server_settings.sql:ro
      - ./db/022_ai_budget.sql:/docker-entrypoint-initdb.d/022_ai_budget.sql:ro
    ports:
      # Bound to loopback, not 0.0.0.0: the host admin console still connects, but on a public IP
      # this was Postgres exposed to the internet with the .env.example password.
      - "127.0.0.1:5432:5432"
    networks: [core]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d cryptoai"]
      interval: 5s
      timeout: 3s
      retries: 30

  api:
    build:
      context: .
      dockerfile: CryptoAITerminal.Server.Api/Dockerfile
    environment:
      DB_CONN: "Host=db;Database=cryptoai;Username=postgres;Password=${DB_PASSWORD:-postgres}"
      ASPNETCORE_URLS: "http://+:8080"
      # This container sits behind caddy, so it is the edge node: it does NOT get
      # CRYPTOAI_KEK_B64. That key unwraps every user's exchange key and wallet key, and
      # TradingService decrypts them into the memory of whichever process registers the cipher —
      # which must never be the internet-facing one. On edge the cipher is not registered,
      # /api/secrets and /api/2fa answer 503 and /api/trade/* is not mapped. See SETUP.md §7.
      CRYPTOAI_ROLE: edge
      # Optional, and NOT the custodial KEK: protects the server's own operational secrets
      # (telegram bot tokens, provider API keys) at rest. Must match on every service that reads
      # them — api, worker, and the executor node if one is running.
      CRYPTOAI_DATA_KEY_B64: ${CRYPTOAI_DATA_KEY_B64:-}
      # Secrets come from .env (gitignored). See .env.example.
      ADMIN_TOKEN: ${ADMIN_TOKEN:?set ADMIN_TOKEN in .env}
      WITHDRAWAL_DELAY_MINUTES: ${WITHDRAWAL_DELAY_MINUTES:-30}
      # Honour X-Forwarded-For only from caddy on the compose bridge; without this every audit
      # row records the proxy's address and all anonymous traffic shares one rate-limit window.
      TRUSTED_PROXY_CIDRS: "${TRUSTED_PROXY_CIDRS:-127.0.0.1/32,::1/128,172.16.0.0/12}"
      #
      # ── Pass-through from .env ────────────────────────────────────────────────────────────
      # Everything below is read straight from the process environment by the code and documented
      # in .env.example. Without these lines a .env entry reaches compose but never reaches the
      # container, so setting ANTHROPIC_API_KEY or LICENSE_PUBLIC_KEY_PEM there did nothing at all.
      #
      # Declared with NO value on purpose. Compose then passes the variable through only when .env
      # actually defines it and leaves it absent otherwise, so the code's own defaults apply.
      # Writing "${VAR:-}" instead injects an empty string, and empty is not "unset" here:
      # LICENSE_PUBLIC_KEY_PEM="" is a key that fails to parse, i.e. every licence rejected.
      LICENSE_PUBLIC_KEY_PEM:
      RATE_LIMIT_PER_MIN:
      # Vendor keys. The admin console writes them into provider_keys instead, which wins; these
      # are the bootstrap path for a fresh box that has no console session yet.
      ANTHROPIC_API_KEY:
      OPENAI_API_KEY:
      AI_ALLOWED_ANTHROPIC_MODELS:
      AI_ALLOWED_OPENAI_MODELS:
      AI_MAX_TOKENS_CAP:
      AI_MAX_REQUEST_BYTES:
      AI_MAX_MESSAGES:
      AI_DAILY_TOKENS_PER_LICENSE:
      AI_ASK_MODEL:
      CACHE_TTL_CANDLES:
      CACHE_TTL_TOKEN:
      CACHE_TTL_NEWS:
      CACHE_TTL_SENTIMENT:
      CACHE_TTL_GAS:
      CACHE_TTL_ONCHAIN:
      CACHE_TTL_WHALES:
      CACHE_TTL_LIQUIDATIONS:
      CACHE_TTL_DIGESTS:
      WATCHLIST_MAX_TOKENS:
      # How long a collector may go quiet before /api/admin/collectors reports degraded.
      COLLECTOR_STALE_MINUTES:
      MANUAL_MAX_NOTIONAL_USD:
    ports:
      # Loopback only. The internet reaches the API through caddy, which terminates TLS; this
      # binding is kept so curl and the admin console still work on the host itself.
      - "127.0.0.1:8080:8080"
    depends_on:
      db:
        condition: service_healthy
    networks: [edge, core]
    restart: unless-stopped

  # TLS terminator and the only service with public ports. Set CRYPTOAI_DOMAIN in .env and it
  # obtains a certificate by itself; unset, it serves plain HTTP on :80 for local use.
  caddy:
    image: caddy:2-alpine
    environment:
      # ":80" when unset OR empty. Caddy's own default syntax only covers "unset", and compose
      # always passes the variable, so the fallback has to be here.
      CRYPTOAI_DOMAIN: ${CRYPTOAI_DOMAIN:-:80}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"   # HTTP/3
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data      # certificates and ACME account - losing this re-issues on next boot
      - caddy_config:/config
    depends_on: [api]
    networks: [edge]
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: CryptoAITerminal.CandleWorker/Dockerfile
    environment:
      DB_CONN: "Host=db;Database=cryptoai;Username=postgres;Password=${DB_PASSWORD:-postgres}"
      # Reads the same protected columns as api (telegram tokens for pushes, provider keys for
      # the collectors), so it needs the same key or those rows read as "not configured".
      CRYPTOAI_DATA_KEY_B64: ${CRYPTOAI_DATA_KEY_B64:-}
      #
      # Pass-through from .env, same rule as on api: no value, so an unset variable stays unset in
      # the container rather than becoming an empty string. The AI_* models here are the ones the
      # background jobs run on — a blank model name is an outage, not a default.
      ANTHROPIC_API_KEY:
      OPENAI_API_KEY:
      # Collection cadence. POLL_BATCH / POLL_TICK_SECONDS * 60 is the request rate ceiling against
      # GeckoTerminal's free tier (~30/min) — the reason to touch these at all.
      POLL_BATCH:
      POLL_TICK_SECONDS:
      POLL_CANDLE_LIMIT:
      POOL_RESOLVE_BATCH:
      POLL_HOT_WINDOW_S:
      POLL_WARM_WINDOW_S:
      POLL_WARM_INTERVAL_S:
      POLL_COLD_INTERVAL_S:
      AI_DIGEST_MODEL:
      AI_SCORE_MODEL:
      AI_ANOMALY_MODEL:
      AI_SCORE_BATCH:
      AI_SCORE_MAX_AGE_HOURS:
      AI_ANOMALY_BATCH:
      AI_ANOMALY_COOLDOWN_HOURS:
      AI_ANOMALY_MIN_MOVE_PCT:
      AI_REVIEW_BATCH:
      AI_REVIEW_DAYS:
    depends_on:
      db:
        condition: service_healthy
    networks: [core]
    restart: unless-stopped

  # Sells licences: Telegram Stars and Crypto Pay, signs the RSA token the terminal validates.
  #
  # Publishes no port and joins neither edge nor core. It talks to api.telegram.org by long polling
  # and to pay.crypt.bot outbound, and it reads nothing out of Postgres - its own SQLite file is the
  # order history. That is also why an outage of this box cannot lose a payment: there is no webhook
  # to miss, the bot simply resumes polling from the last update id when it comes back.
  licensebot:
    build:
      context: .
      dockerfile: CryptoAITerminal.LicenseBot/Dockerfile
    environment:
      # The signing key is mounted, not baked and not passed inline: it is the one secret that lets
      # anyone mint licences for the product. Read-only, and outside the image.
      LICENSE_PRIVATE_KEY_PATH: /run/secrets/license-signing/private.pem
      BOT_DB_PATH: /data/licensebot.db
      # No value: absent unless .env sets it, so the code's defaults apply. See the note on api.
      BOT_TOKEN:
      BOT_ADMIN_IDS:
      BOT_CURRENCY:
      BOT_PROVIDER_TOKEN:
      CRYPTOPAY_TOKEN:
      CRYPTOPAY_ASSETS:
      CRYPTOPAY_API_BASE:
      CRYPTO_FIAT:
    volumes:
      # The DIRECTORY is mounted, not the file. A bind mount of a missing file makes Docker create a
      # directory in its place, which surfaces later as an unreadable-key error from inside the
      # container; a missing directory just mounts empty, and the bot then exits on its own message
      # ("License private key missing") which says exactly what to do.
      - ./.license-signing:/run/secrets/license-signing:ro
      - licensebot_data:/data
    networks: [bot]
    restart: unless-stopped

  # Encrypted incremental backups of the database to S3. Off until RESTIC_REPOSITORY and
  # RESTIC_PASSWORD are set - and it says so loudly rather than pretending to run, because until
  # then the pgdata volume is the only copy of the licence database.
  backup:
    build:
      context: ./docker/backup
    environment:
      PGPASSWORD: ${DB_PASSWORD:-postgres}
      DB_HOST: db
      DB_NAME: cryptoai
      DB_USER: postgres
      RESTIC_REPOSITORY: ${RESTIC_REPOSITORY:-}
      RESTIC_PASSWORD: ${RESTIC_PASSWORD:-}
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY:-}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_KEY:-}
      BACKUP_INTERVAL_SECONDS: ${BACKUP_INTERVAL_SECONDS:-21600}
      BACKUP_KEEP_DAILY: ${BACKUP_KEEP_DAILY:-7}
      BACKUP_KEEP_WEEKLY: ${BACKUP_KEEP_WEEKLY:-4}
      BACKUP_KEEP_MONTHLY: ${BACKUP_KEEP_MONTHLY:-6}
      # The bot's order history, backed up alongside Postgres. Skipped with a log line when the file
      # is not there, so this stays correct on a box where the bot has not been started.
      BOT_DB: /licensebot/licensebot.db
    volumes:
      - licensebot_data:/licensebot:ro
    depends_on:
      db:
        condition: service_healthy
    networks: [core]
    restart: unless-stopped

  # The executor is deliberately NOT part of this contour.
  #
  # Trading and bots run on the user's machine, so nothing here needs to decrypt a user's exchange
  # key or wallet private key — and the executor is the only component that holds CRYPTOAI_KEK_B64,
  # the master key those secrets are wrapped with. Starting it alongside the public API would put
  # that key on an internet-facing host to do work nobody asked it to do.
  #
  # This used to be aspirational: the api service above required CRYPTOAI_KEK_B64 and registered
  # the cipher, so the master key WAS on the internet-facing node. It is now pinned shut by
  # CRYPTOAI_ROLE=edge on that service rather than by this comment.
  #
  # If server-side execution is ever reinstated it belongs on a separate node with no public IP
  # and CRYPTOAI_ROLE=core, exactly as db/004_custodial.sql describes.

networks:
  edge: {}
  core: {}
  # Its own segment on purpose: the bot needs outbound internet and nothing else. On core it could
  # reach Postgres, on edge the api - neither is a thing it ever does, and it is the process holding
  # the licence signing key.
  bot: {}

volumes:
  pgdata: {}
  caddy_data: {}
  caddy_config: {}
  licensebot_data: {}
